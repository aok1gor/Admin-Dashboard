<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div id="dashboard">
                <div id="dashboard-logo"><img src="img/abacus.svg" height="33"></div>
                <div id="dashboard-text">Dashboard</div>
            </div>

            <div id="home">
                <div id="home-logo"><img src="img/home-variant.svg" height="15"></div>
                <div id="home-text">Home</div>
            </div>

            <div id="profile">
                <div id="profile-logo"><img src="img/face-man-profile.svg" height="15"></div>
                <div id="profile-text">Profile</div>
            </div>

            <div id="messages">
                <div id="messages-logo"><img src="img/message.svg" height="15"></div>
                <div id="message-text">Messages</div>
            </div>

            <div id="history">
                <div id="history-logo"><img src="img/clock-outline.svg" height="15"></div>
                <div id="history-text">History</div>
            </div>

            <div id="tasks">
                <div id="tasks-logo"><img src="img/note-multiple.svg" height="15"></div>
                <div id="tasks-text">Tasks</div>
            </div>

            <div id="communities">
                <div id="communities-logo"><img src="img/account-group.svg" height="15"></div>
                <div id="communities-text">Communities</div>
            </div>

            <div id="settings">
                <div id="settings-logo"><img src="img/cog-outline.svg" height="15"></div>
                <div id="settings-text">Settings</div>
            </div>

            <div id="support">
                <div id="support-logo"><img src="img/book-open-blank-variant.svg" height="15"></div>
                <div id="support-text">Support</div>
            </div>

            <div id="privacy">
                <div id="privacy-logo"><img src="img/shield-check-outline.svg" height="15"></div>
                <div id="prvacy-text">Privacy</div>
            </div>

        </div>

        <div class="top-bar">
            <div id="top-part1">
               <div><img src="img/magnify.svg" height="20"></div>
               <div><input></div> 
            </div>

            <div id="top-part2">
                <div><img src="img/bell-badge.svg" height="25"></div>
                <div class="small-avatar"><img src="img/circle.svg" height="40"></div>
                <div id="username">Morgan Oakley</div>
            </div>

            <div id="top-part3">
                <div><img src="img/circle.svg" height="50"></div>
                <div id="greetings">Hi there,</div>
                
            </div>

        </div>
        
        <div class="board"></div>
    </div>

</body>
</html>
